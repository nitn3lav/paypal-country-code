[package]
name = "paypal-country-code"
version = "0.1.0"
authors = ["K. Valentin Leistner <git@valentinleistner.com>"]
license = "MIT OR Apache-2.0"
description = "PayPal contry codes, automatically generated from https://developer.paypal.com/reference/country-codes.md"
repository = "https://github.com/nitn3lav/paypal-country-code"
keywords = ["paypal", "country", "countrycode"]
readme = "README.md"
edition = "2024"

[dependencies]
serde = { version = "1.0.229", optional = true }

[features]
serde = ["dep:serde"]
